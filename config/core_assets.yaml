# Settlement / base assets only. These are the two things the wallet always
# holds some of and swaps in and out of -- not discovery candidates, and no
# per-cycle due diligence applies to them the way it does to a discovered
# token (see config/discovery.yaml). Still worth a one-time verify against an
# authoritative source before funding the wallet -- see docs/STRATEGY.md's
# due-diligence checklist and docs/RUNBOOK.md's first-time setup.

assets:
  - symbol: SOL
    mint: "So11111111111111111111111111111111111111112"
    role: base_asset
    verified: false
    verified_date: null
    notes: "Native asset (wrapped SOL mint). Settlement asset for every swap."

  - symbol: USDC
    mint: "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
    role: settlement_stable
    verified: false
    verified_date: null
    notes: "Circle's official Solana USDC mint (per training-data recollection). The 'cash' / risk-off position between trades. Verify against circle.com's official contract list."
