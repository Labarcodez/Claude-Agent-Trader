# Settlement / reference assets only. These are not discovery candidates and
# get no per-cycle due-diligence the way a discovered trading pair does (see
# config/discovery.yaml) -- Kraken's own listing review is the trust anchor
# for what's tradeable at all, but a token still has to clear
# research/discover_candidates.py's live liquidity/spread checks every cycle
# before it's eligible to trade. These two are exempt from that because
# they're what the agent holds as cash between trades, not something it
# takes a directional position in.

assets:
  - symbol: USD
    kraken_asset_code: "ZUSD"
    role: base_asset
    notes: >
      Primary settlement currency. Kraken Pro accounts in supported
      jurisdictions can fund this directly via wire/ACH/SEPA -- see
      docs/KRAKEN_CLI_SETUP.md. This is the "cash" position between trades;
      circuit-breaker floor and portfolio value are computed in USD.

  - symbol: USDT
    kraken_asset_code: "USDT"
    role: settlement_stable_secondary
    notes: >
      Secondary settlement currency -- many smaller-cap Kraken pairs quote in
      USDT rather than USD directly (research/discover_candidates.py allows
      both quote currencies to keep the eligible universe wide). Treated as
      cash-equivalent for portfolio-value and heat calculations, but is
      itself a stablecoin with its own (small, real) counterparty/depeg risk
      -- don't treat it as literally risk-free the way a USD balance is.

# BTC is intentionally NOT listed here as a core/settlement asset, unlike the
# old Solana version's SOL. It's the regime filter's reference coin
# (config/risk.yaml's regime_reference_coin) and will almost certainly clear
# discovery's blue_chip tier on its own live liquidity/spread data every
# cycle -- there's no need to hardcode an exemption for it. Letting it earn
# its tier from real data, like everything else, is more correct than a
# special case.
