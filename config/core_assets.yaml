# Settlement / base currency only. USD is the one thing the Kraken account
# always holds some of and trades in and out of -- not a discovery candidate,
# and no per-cycle safety check applies to it the way it does to a
# discovered pair (see config/discovery.yaml). Unlike the old Solana
# pipeline, there's no wrapped/on-chain settlement asset to verify here --
# it's literally US dollars, held as Kraken account balance (asset code
# "ZUSD" in Kraken's own API).
#
# BTC and ETH are NOT listed here -- on Kraken they're ordinary (blue_chip
# tier) discovery candidates like any other pair, not structural
# settlement assets the way SOL was for the old Solana wallet.

assets:
  - symbol: USD
    kraken_asset_code: "ZUSD"
    role: settlement_currency
    notes: "Cash / risk-off balance between trades. Not a discovery candidate -- see config/discovery.yaml."
