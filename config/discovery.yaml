# Dynamic Kraken pair discovery pipeline. This REPLACES a hand-maintained
# token list: every trade-cycle, the agent asks Kraken "what USD pairs do
# you actually list right now" and runs every one through automated
# tradability/liquidity checks before it's ever eligible to trade -- no
# human has to add a pair by name first. Two exceptions: `pinned_candidates`
# (always considered) and `denylist` (never traded, no matter what).
#
# Reference implementation: research/discover_candidates.py -- this file's
# `safety` and `tiers` values should match that script's CLI defaults, AND
# the same defaults duplicated in paper_trading/run_paper_cycle.py and
# backtest/backtest_all.py (all three mirror this file rather than parsing
# it, to stay dependency-free -- see research/discover_candidates.py's
# docstring). Change one, change all three.
#
# Kraken already reviews and vets everything it lists (delisting risk, not
# rug-pull risk), so there's no on-chain audit/mint-authority/RugCheck stage
# the way the old Solana pipeline needed -- see
# research/discover_candidates.py's module docstring for the full reasoning.
# What replaces it: is the pair actually online, does it have enough 24h
# volume to exit a position without moving the price yourself, and is the
# bid/ask spread tight enough that entering and exiting doesn't hand the
# edge away to the spread alone.

enabled: true

sources:
  kraken_usd_pairs:
    enabled: true    # every online, USD-quoted, non-dark-pool pair from Kraken's public AssetPairs + Ticker
                      # endpoints -- one flat, complete, already-deduped universe (a few hundred pairs, not a
                      # few thousand), so there's no momentum-snapshot/rotation concept the way the old
                      # Jupiter-based sources needed: everything is evaluated every cycle.

# A few hundred USD pairs is cheap enough (two bulk public API calls, no
# per-candidate secondary lookup) to evaluate in full every cycle -- set
# comfortably above Kraken's current USD-pair count (~637 as of writing) so
# this is a safety ceiling, not an active truncation. If it's ever exceeded,
# the highest-24h-volume pairs are kept (deterministic, not sampled).
max_candidates_per_cycle: 700

# Always considered as candidates regardless of whether this cycle's ranking
# would otherwise cut them (only relevant once Kraken's pair count exceeds
# max_candidates_per_cycle). Still has to pass every safety check below every
# time -- this is not a bypass. Use Kraken pair names, e.g. "XBTUSD".
pinned_candidates: []

# Pairs that must NEVER be traded even if they'd otherwise pass every
# automated check -- a manual override for anything you have specific reason
# to distrust or just don't want the agent touching.
denylist: []

# ---- Automated safety thresholds (ALL must pass; mirrors the script's
# argparse defaults) ---------------------------------------------------------
safety:
  min_24h_volume_usd: 1000000   # exit-liquidity proxy, replaces the old on-chain liquidity-pool check. $1M is a
                                 # real but not overly strict floor for a centralized-exchange pair -- revisit
                                 # with real paper/live results, same tuning process the old min_liquidity_usd
                                 # went through.
  max_spread_bps: 50.0           # bid/ask spread as a fraction of mid price. 50bps excludes the most illiquid
                                  # tail of Kraken's USD pairs without limiting the universe to only the handful
                                  # of most-traded majors.
  require_status_online: true    # Kraken's own AssetPairs `status` field must be "online" -- the exchange-level
                                  # equivalent of the old mint/freeze-authority checks ("can this actually be
                                  # traded right now"). cancel_only/post_only/limit_only/reduce_only/
                                  # work_in_progress pairs are excluded.

# ---- Risk tiers (computed live from each candidate's own data, never
# hand-labeled) --------------------------------------------------------------
# Sizing multipliers apply on top of config/risk.yaml's max_position_fraction
# etc. Kraken has no holder-count/on-chain-verification signal, so tiering
# rests on market cap (via CoinGecko, looked up in bulk for a small curated
# list of Kraken-listed majors -- KRAKEN_TO_COINGECKO_ID in
# research/discover_candidates.py) AND this pair's own 24h USD volume on
# Kraken -- both must clear a tier's bar. Anything that passes safety but
# doesn't clear "established" lands in "emerging" -- smaller-cap/lower-volume
# assets, sized smaller for their variance, not excluded.
#
# Position-COUNT caps (as opposed to sizing multipliers) live entirely in
# config/risk.yaml (max_concurrent_positions, max_emerging_tier_positions,
# max_same_ecosystem_positions) -- deliberately not duplicated here.
tiers:
  blue_chip:
    min_mcap_usd: 50000000000     # $50B -- Kraken's universe includes real large-cap assets (BTC, ETH), much
                                   # higher than the old Solana-memecoin-shaped $50M threshold
    min_24h_volume_usd: 100000000
    position_fraction_multiplier: 1.0
  established:
    min_mcap_usd: 1000000000
    min_24h_volume_usd: 10000000
    position_fraction_multiplier: 0.7
  emerging:
    position_fraction_multiplier: 0.4
