# Dynamic token discovery pipeline. This REPLACES a hand-maintained token
# list: every trade-cycle, the agent asks live data sources "what's worth
# looking at right now" and runs every candidate through automated,
# on-chain-backed safety checks before it's ever eligible to trade -- no
# human has to add a token by name first. Two exceptions: `pinned_candidates`
# (always considered) and `denylist` (never traded, no matter what).
#
# Reference implementation: research/discover_candidates.py -- this file's
# `safety` and `tiers` values should match that script's CLI defaults, AND
# the same defaults duplicated in paper_trading/run_paper_cycle.py and
# backtest/backtest_all.py (all three mirror this file rather than parsing
# it, to stay dependency-free -- see research/discover_candidates.py's
# docstring). Change one, change all four. Reasoning and a real worked
# example (live run output, including why it rejected USDT and several
# memecoins) are in docs/STRATEGY.md "Autonomous discovery".

enabled: true

sources:
  jupiter_top_organic_score:
    enabled: true
    intervals: ["6h", "24h"]     # "organic" = filtered for wash-traded/bot volume, i.e. real trader interest
    limit_per_interval: 15
  jupiter_top_trending:
    enabled: true
    intervals: ["1h", "6h"]
    limit_per_interval: 15
  jupiter_recent:
    enabled: true
    limit: 15                    # newest pools -- highest-risk source; the pool-age gate below is what keeps this safe to include

# Widened from 20 -- with the old cap, real eligible candidates (e.g. a live
# run that found VINE/TripleT eligible) were sitting past position #15,
# outside paper_trading's old max-candidates default of 15 -- so breadth was
# the limiting factor, not safety. 40 doubles evaluation depth while staying
# well inside "be a good citizen to free public APIs" territory (RugCheck is
# only spent on stage-1 survivors, per research/discover_candidates.py).
max_candidates_per_cycle: 40

# Always considered as candidates regardless of whether live discovery
# surfaces them this cycle. Use this for a token you specifically want kept
# in rotation (still has to pass every safety check below every time -- this
# is not a bypass) and for any open position, so it never "falls off" and
# becomes impossible for the agent to reason about exiting.
pinned_candidates: []   # e.g. ["JUPyiwrYJFskUPiHa7hkeR8VUtAeFoSYbKedZNsDvCN"]

# Tokens that must NEVER be traded even if they'd otherwise pass every
# automated check -- a manual override for anything you have specific reason
# to distrust (e.g. a token that later turns out to be a rug the automated
# checks didn't catch, or a token you just don't want the agent touching).
denylist: []

# ---- Automated safety thresholds (ALL must pass; mirrors the script's
# argparse defaults) ---------------------------------------------------------
safety:
  min_liquidity_usd: 250000
  min_holder_count: 500
  min_organic_score: 40          # Jupiter's own organicScore (0-100ish); below this, volume looks bot/wash-traded rather than real demand
  min_pool_age_hours: 72         # reject anything with a pool younger than 3 days -- the highest-risk rug window
  max_top_holder_pct: 22.0       # single largest non-team holder's share of supply, from Jupiter's audit.topHoldersPercentage
                                  # raised from 20.0 on 2026-08-20: MET (liq $2.7M, 36.5k holders, organic score 92.2,
                                  # mint/freeze renounced, no RugCheck flags, adaptive_ensemble backtest +35.67% OOS /
                                  # -8.82% DD / ok overfit) was rejected on this alone at 21.6% -- a 1.6pt miss with
                                  # every other signal clean. Narrow, evidence-specific change, not a general loosening;
                                  # re-tighten if a token admitted only by this widened band turns out to be a real rug.
  require_mint_authority_disabled: true    # Jupiter's audit.mintAuthorityDisabled must be true
  require_freeze_authority_disabled: true  # Jupiter's audit.freezeAuthorityDisabled must be true
  require_rugcheck_not_rugged: true        # cross-check via RugCheck.xyz -- the one thing Jupiter's own data doesn't cover
  reject_rugcheck_danger_risks: true       # any RugCheck risk flag at danger/critical/high level is disqualifying

# ---- Risk tiers (computed live from each candidate's own data, never
# hand-labeled) --------------------------------------------------------------
# Sizing multipliers apply on top of config/risk.yaml's max_position_fraction
# etc. "emerging" is the catch-all for anything that passes every safety
# check above but isn't large/established yet -- this is where memecoins
# land. They are IN SCOPE, sized smaller for their variance, not excluded.
#
# Position-COUNT caps (as opposed to sizing multipliers) live entirely in
# config/risk.yaml (max_concurrent_positions, max_emerging_tier_positions,
# max_same_ecosystem_positions) -- deliberately not duplicated here, so
# there's exactly one place to look for "how many positions can be open."
tiers:
  blue_chip:
    min_mcap_usd: 50000000
    min_holder_count: 10000
    require_jupiter_verified: true
    position_fraction_multiplier: 1.0
  established:
    min_mcap_usd: 5000000
    min_holder_count: 2000
    position_fraction_multiplier: 0.7
  emerging:
    position_fraction_multiplier: 0.4
